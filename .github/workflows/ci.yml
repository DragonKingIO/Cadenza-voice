name: build-and-test

# Never use pull_request_target here: pull requests from forks must not run with this repository's secrets.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./cadenza/tools/check-no-secrets.sh

  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the inference library
        run: ./cadenza/tools/fetch-sherpa-onnx.sh
      - name: Build (ad hoc signed package)
        run: ./cadenza/build.sh --stage-only
      - name: Self-tests
        run: |
          T="$RUNNER_TEMP/app"; mkdir -p "$T"
          unzip -q cadenza/build/stage.noindex/Cadenza.app.zip -d "$T"
          APP="$(ls -d "$T"/*.app)"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Cadenza")"; echo "architectures: $ARCHS"
          case "$ARCHS" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::the package must contain both arm64 and x86_64"; exit 1 ;; esac
          ./cadenza/tools/run-selftests.sh "$APP"
      - name: Keep the package for the compatibility runs
        uses: actions/upload-artifact@v4
        with:
          name: cadenza-package
          path: cadenza/build/stage.noindex/Cadenza.app.zip
          retention-days: 3
      - name: Trigger state machine
        run: ./cadenza/trigger-state-machine/run-tests.sh

  # The same package, run on the other kinds of Mac the project says it supports: Intel, and macOS 14 and 15 on Apple silicon.
  # Apple's runners are real machines (or VMs of them), so this checks the claims in the README on actual systems.
  compatibility:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cadenza-package
          path: package
      - name: Self-tests on this system
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          unzip -q package/Cadenza.app.zip -d "$RUNNER_TEMP/app"
          ./cadenza/tools/run-selftests.sh "$(ls -d "$RUNNER_TEMP"/app/*.app)"
