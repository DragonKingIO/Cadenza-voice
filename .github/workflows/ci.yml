name: build-and-test

# Never use pull_request_target here: pull requests from forks must not run with this repository's secrets.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./cadenza/tools/check-no-secrets.sh

  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the inference library
        run: ./cadenza/tools/fetch-sherpa-onnx.sh
      - name: Build (ad hoc signed package)
        run: ./cadenza/build.sh --stage-only
      - name: Self-tests
        run: |
          T="$RUNNER_TEMP/app"; mkdir -p "$T"
          unzip -q cadenza/build/stage.noindex/Cadenza.app.zip -d "$T"
          BIN="$(ls -d "$T"/*.app)/Contents/MacOS/Cadenza"
          test -x "$BIN" || { echo "::error::executable not found: $BIN"; exit 1; }
          ARCHS="$(lipo -archs "$BIN")"; echo "architectures: $ARCHS"
          case "$ARCHS" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::the package must contain both arm64 and x86_64"; exit 1 ;; esac
          for suite in selftest selftest-settings-ui selftest-settings-polish selftest-status-menu selftest-asr-settings selftest-asr-entry selftest-local-model selftest-trigger-stage2 selftest-screenshot; do
            echo "== $suite"
            LOG="$RUNNER_TEMP/$suite.log"
            STATUS=0; "$BIN" --$suite > "$LOG" 2>&1 || STATUS=$?
            grep -a -E "FAIL|failures=" "$LOG" || true
            if [ "$STATUS" -ne 0 ]; then tail -n 20 "$LOG"; echo "::error::$suite exited with status $STATUS"; exit 1; fi
            # A suite passes only when it ran to the end and reported no failures.
            if grep -a -q "FAIL" "$LOG" || ! grep -a -q "failures=0" "$LOG"; then echo "::error::$suite failed"; exit 1; fi
          done
          "$BIN" --check-brand-resources
      - name: Trigger state machine
        run: ./cadenza/trigger-state-machine/run-tests.sh
