name: Bug report (问题反馈)
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please do not attach recordings, transcripts, API keys or unredacted logs.**
        请不要上传录音、识别文字、密钥或未处理的日志。
  - type: textarea
    id: what
    attributes:
      label: What happened? (发生了什么)
      description: What you did, what you expected, and what you saw instead.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (复现步骤)
      placeholder: "1. …\n2. …"
  - type: input
    id: version
    attributes:
      label: App version (应用版本)
      description: Settings → About
    validations: { required: true }
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model (系统版本和机型)
      placeholder: "macOS 26.0, MacBook Pro M3"
    validations: { required: true }
  - type: dropdown
    id: engine
    attributes:
      label: Recognition engine in use (使用的识别引擎)
      options: ["Local model", "Cloud service", "Mac built-in", "Not related to recognition"]
    validations: { required: true }
  - type: input
    id: model
    attributes:
      label: Model or provider name (模型或服务商)
      placeholder: "SenseVoice / iFlytek / …"
  - type: dropdown
    id: trigger
    attributes:
      label: Trigger mode (触发方式)
      options: ["Hold the shortcut", "Tap the shortcut to start and stop", "In-app button or menu", "Not related to the trigger"]
    validations: { required: true }
  - type: textarea
    id: permissions
    attributes:
      label: Permission status (权限状态)
      description: Settings → Privacy shows Microphone, Accessibility and Input Monitoring. Say which are allowed, and for a shortcut problem whether the page says "on but not working".
  - type: textarea
    id: logs
    attributes:
      label: Log lines (optional, 可选)
      description: Settings → Privacy shows where the log is. The log holds state, errors and text lengths, never audio or transcripts. Remove anything private before pasting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check (隐私确认)
      options:
        - label: I removed recordings, transcripts, credentials and personal paths from everything I attached.
          required: true
