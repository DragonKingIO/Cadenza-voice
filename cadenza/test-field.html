<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>随言 · 临时测试文本框</title>
<style>
  body { font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; max-width: 640px; margin: 40px auto; color: #222; }
  textarea { width: 100%; height: 220px; font-size: 16px; padding: 12px; box-sizing: border-box; }
  p { color: #666; }
  #hint { color: #0a7; font-weight: 600; }
</style>
</head>
<body>
<h2>随言 · 临时测试文本框</h2>
<p>点击下方文本框获得焦点，然后使用随言当前设置的全局快捷键。默认左 Option：单独按下开始、松开结束；组合键或 Esc 取消。切换绑定需在软件中单独设置，完整按压一次开始、再按一次结束。
本页面用于验证文字上屏与原输入源保持，不保存输入内容。语音识别的联网行为由随言中的引擎和上传同意设置决定。</p>
<textarea id="t" placeholder="在这里测试……"></textarea>
<p>焦点状态：<span id="hint">未聚焦</span></p>
<script>
  const t = document.getElementById('t'), hint = document.getElementById('hint');
  t.addEventListener('focus', () => hint.textContent = '已聚焦');
  t.addEventListener('blur', () => hint.textContent = '未聚焦');
</script>
</body>
</html>
